services:
  torchnode:
    build: .
    image: ${TORCHNODE_IMAGE:-torchnode:local}
    pull_policy: ${TORCHNODE_PULL_POLICY:-build}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - torchnode-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  torchnode-data:
