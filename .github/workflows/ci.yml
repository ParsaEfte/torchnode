name: CI and Docker distribution

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v7
        with:
          go-version-file: p2p-helper/go.mod
          cache-dependency-path: p2p-helper/go.sum
      - name: Java tests and package
        run: |
          mvn -B test
          mvn -B -DskipTests package
      - name: Go tests, vet, race
        working-directory: p2p-helper
        run: |
          test "$(go list -m -f '{{.Version}}' github.com/ethereum/go-ethereum)" = v1.17.6
          go test ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Verify development and release tag policy
        shell: bash
        run: |
          bash scripts/docker-tags.sh refs/heads/main 1234567890abcdef > "$RUNNER_TEMP/main-tags"
          bash scripts/docker-tags.sh refs/tags/v0.0.1 1234567890abcdef > "$RUNNER_TEMP/release-tags"
          diff -u <(printf '%s\n' parsa202089/torchnode:edge parsa202089/torchnode:sha-1234567890ab) "$RUNNER_TEMP/main-tags"
          diff -u <(printf '%s\n' parsa202089/torchnode:0.0.1 parsa202089/torchnode:0.0 parsa202089/torchnode:0 parsa202089/torchnode:latest) "$RUNNER_TEMP/release-tags"
      - name: Docker build
        run: docker build --platform linux/amd64 -t torchnode:ci .
      - name: Container smoke and persistence
        run: bash scripts/container-smoke.sh torchnode:ci
      - name: Diagnostic logs on failure
        if: failure()
        run: docker ps -a

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          bash scripts/docker-tags.sh "$GITHUB_REF" "$GITHUB_SHA" > "$RUNNER_TEMP/docker-tags"
          {
            echo 'tags<<EOF'
            cat "$RUNNER_TEMP/docker-tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prevent release-version overwrite
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          first_tag=$(head -n 1 "$RUNNER_TEMP/docker-tags")
          if docker buildx imagetools inspect "$first_tag" >/dev/null 2>&1; then
            echo 'Release version tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
